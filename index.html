><p class="form-status" id="account-status" role="status"></p></section><section id="account-recharge" hidden><button class="account-back account-section-back" type="button" id="recharge-back">← 返回账户</button><h3>充值</h3><div class="recharge-options" role="radiogroup" aria-label="预设充值金额"><button type="button" role="radio" data-recharge-option data-amount-cents="1000" aria-checked="true" tabindex="0">￥10</button><button type="button" role="radio" data-recharge-option data-amount-cents="5000" aria-checked="false" tabindex="-1">￥50</button><button type="button" role="radio" data-recharge-option data-amount-cents="10000" aria-checked="false" tabindex="-1">￥100</button></div><label class="recharge-input-label" for="recharge-amount">自定义金额</label><div class="recharge-input-wrap"><span aria-hidden="true">￥</span><input id="recharge-amount" type="number" min="10" max="9999" step="0.01" value="10.00" inputmode="decimal" autocomplete="off" aria-describedby="subscription-upgrade-note"></div><p id="subscription-upgrade-note" class="recharge-help">最低 ￥10，最高 ￥9999，支持两位小数</p><button class="account-main-button recharge-submit" type="button" data-subscription-upgrade disabled aria-describedby="subscription-upgrade-note">支付宝充值</button><p id="subscription-payment-status" class="subscription-status" role="status" aria-live="polite"></p><div id="alipay-form-container" hidden aria-hidden="true"></div></section><a class="account-feedback" href="mailto:gnepaij@qq.com">问题反馈 <span aria-hidden="true">↗</span></a></div></div></dialog>
