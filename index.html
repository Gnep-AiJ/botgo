<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9dd8ff" />
    <meta name="description" content="BotGo 希望让天下生意都拥有自己的数字能力。" />
    <title>BotGo — 让天下生意都拥有自己的数字能力</title>
    <link rel="stylesheet" href="./styles.css?v=20260825.11" />
  </head>
  <body>
    <a class="skip-link" href="#story">跳到品牌文案</a>

    <div class="cinema" id="cinema">
      <div class="scene" id="scene" aria-hidden="true">
        <picture data-deferred-picture>
          <source media="(max-width: 820px)" data-srcset="./assets/botgo-city-clean-mobile.webp?v=20260825.11" type="image/webp" />
          <img data-src="./assets/botgo-city-clean-v2.webp?v=20260825.11" width="1672" height="941" alt="" fetchpriority="high" decoding="async" />
        </picture>
      </div>
      <div class="robot-rig" id="robot-rig" role="img" aria-label="正在值班的 BotGo 数字同事机器人">
        <i class="robot-halo" aria-hidden="true"></i>
        <div class="robot-float">
          <picture data-deferred-picture>
            <source media="(max-width: 820px)" data-srcset="./assets/botgo-robot-dynamic-mobile.webp?v=20260825.11" type="image/webp" />
            <img data-src="./assets/botgo-robot-dynamic-v2.webp?v=20260825.11" width="900" height="916" alt="" decoding="async" fetchpriority="low" />
          </picture>
        </div>
        <i class="robot-shadow" aria-hidden="true"></i>
      </div>
      <div class="scene-grade" aria-hidden="true"></div>
      <div class="volume-light" aria-hidden="true"></div>
      <div class="hud-grid" aria-hidden="true"></div>
      <div class="horizon-flare" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="#" aria-label="重新播放 BotGo 品牌开场">
          <span class="brand-word">BotG</span>
          <span class="brand-bot" aria-hidden="true">
            <i class="brand-antenna"></i>
            <i class="brand-eye brand-eye--left"></i>
            <i class="brand-eye brand-eye--right"></i>
          </span>
        </a>

        <div class="header-actions">
          <div class="system-state" aria-hidden="true">
            <span></span>
            <b>BOTGO / READY</b>
            <small>CITY NODE · ONLINE</small>
          </div>

          <div class="contact-area">
            <button class="contact-trigger" id="contact-trigger" type="button" aria-expanded="false" aria-controls="contact-panel">
              联系我们 <i aria-hidden="true"></i>
            </button>

            <div class="contact-backdrop" aria-hidden="true"></div>

            <section class="contact-panel" id="contact-panel" role="dialog" aria-modal="true" aria-labelledby="contact-title" aria-describedby="contact-description" aria-hidden="true" tabindex="-1" inert>
              <button class="contact-close" type="button" aria-label="关闭微信联系面板">×</button>
              <div class="wechat-qr">
                <img data-src="./Wechat.jpg?v=20260825.11" width="888" height="1197" alt="冬黎 Gabon 的微信二维码" decoding="async" loading="lazy" draggable="false" />
              </div>
              <div class="contact-copy">
                <p class="contact-kicker">WECHAT / CONTACT</p>
                <h2 id="contact-title">个人订阅 / 企业定制</h2>
                <p class="contact-note">从个人订阅到企业定制，按你的场景配置。</p>
                <div class="contact-lines" id="contact-description">
                  <div class="contact-service">
                    <strong>个人订阅</strong>
                    <p>网页对话与 BotGo Desktop</p>
                  </div>
                  <div class="contact-service">
                    <strong>企业定制</strong>
                    <p>Agent、知识库与定制部署</p>
                  </div>
                </div>
                <div class="contact-status"><i></i><span>WECHAT CHANNEL / READY</span></div>
                <small>冬黎 Gabon</small>
              </div>
            </section>
          </div>
        </div>
      </header>

      <main class="story" id="story" aria-live="polite">
        <section class="copy copy--past" aria-label="二十年前，互联网时代，Alibaba 提出让天下没有难做的生意">
          <div class="past-layout">
            <p class="fragment past-time" style="--delay: 0ms; --from-x: -18px; --from-y: 8px">二十年前</p>
            <p class="fragment past-era" style="--delay: 190ms; --from-x: 20px; --from-y: -6px">互联网时代</p>
            <p class="fragment past-speaker" style="--delay: 440ms; --from-x: -12px; --from-y: 10px"><strong>Alibaba</strong> 提出</p>
            <h1 class="fragment past-quote past-quote--one" style="--delay: 700ms; --from-x: 25px; --from-y: 5px">让天下没有</h1>
            <h1 class="fragment past-quote past-quote--two" style="--delay: 910ms; --from-x: 34px; --from-y: 4px">难做的生意</h1>
            <i class="past-trace" aria-hidden="true"></i>
          </div>
        </section>

        <section class="copy copy--future" aria-label="二十年后，AI 时代，BotGo 希望让天下生意都拥有自己的数字能力">
          <div class="future-layout">
            <div class="fragment future-era" style="--delay: 0ms; --from-x: -14px; --from-y: 8px">
              <span>二十年后</span><i></i><span>AI 时代</span>
            </div>
            <p class="fragment future-speaker" style="--delay: 200ms; --from-x: 18px; --from-y: 7px"><strong>BotGo</strong> 希望让天下生意</p>
            <h2 class="fragment future-own" style="--delay: 430ms; --from-x: 30px; --from-y: 8px">都拥有自己的</h2>
            <h2 class="fragment digital-team" style="--delay: 600ms; --from-x: -22px; --from-y: 10px">数字能力</h2>
            <a class="home-workspace-cta fragment" href="./workspace.html?view=chat" style="--delay: 760ms; --from-x: 0; --from-y: 12px">进入 BotGo AI 工作台 <span aria-hidden="true">↗</span></a>
          </div>
        </section>
      </main>

      <aside class="bot-services" aria-label="BotGo AI 开发入口">
        <button class="service-chip service--site" type="button" data-workspace="web" aria-label="进入 BotGo AI 工作台" style="--service-delay: 0ms">
          <span class="service-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 5.5h16v13H4zM4 9h16M7 7.2h.01M10 7.2h.01" /></svg>
          </span>
          <span class="service-copy"><b><span class="service-label-full">BotGo AI 工作台</span><span class="service-label-short">BotGo AI</span></b></span>
          <i class="service-state" aria-hidden="true"></i>
        </button>

        <button class="service-chip service--agent" type="button" data-workspace="desktop" aria-label="了解 BotGo Desktop" style="--service-delay: 100ms">
          <span class="service-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 9h8M9 13h6M7 18l-3 2 1-4a8 8 0 1 1 3 2z" /></svg>
          </span>
          <span class="service-copy"><b><span class="service-label-full">BotGo Desktop</span><span class="service-label-short">Desktop</span></b></span>
          <i class="service-state" aria-hidden="true"></i>
        </button>

        <button class="service-chip service--tools" type="button" data-workspace="guide" aria-label="查看使用指南" style="--service-delay: 200ms">
          <span class="service-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4" /></svg>
          </span>
          <span class="service-copy"><b><span class="service-label-full">使用指南</span><span class="service-label-short">指南</span></b></span>
          <i class="service-state" aria-hidden="true"></i>
        </button>

      </aside>

      <div class="chapter-meter" aria-hidden="true">
        <div class="chapter chapter--past"><i></i><span>INTERNET ERA</span></div>
        <div class="chapter chapter--future"><i></i><span>AI ERA</span></div>
      </div>
    </div>

    <script src="./app.js?v=20260825.11"></script>
  </body>
</html>
