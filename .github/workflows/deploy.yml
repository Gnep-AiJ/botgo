name: Deploy BotGo

# Deploys after the Verify workflow succeeds on main. Standard GitHub-hosted
# runners are free for public repositories, so this path has no build quota.
# Steps skip themselves until the Cloudflare credentials below are configured.

on:
  workflow_run:
    workflows: ["Verify BotGo website and Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOTGO_D1_DATABASE_ID: ${{ vars.BOTGO_D1_DATABASE_ID }}
      BOTGO_ALIPAY_APP_ID: ${{ vars.BOTGO_ALIPAY_APP_ID }}
      BOTGO_PUBLIC_ORIGIN: ${{ vars.BOTGO_PUBLIC_ORIGIN || 'https://botgo.win' }}
      BOTGO_SUPPORT_EMAIL: ${{ vars.BOTGO_SUPPORT_EMAIL }}
      BOTGO_WECHAT_ID: ${{ vars.BOTGO_WECHAT_ID }}
      BOTGO_CONTACT_QR_BASE64: ${{ secrets.BOTGO_CONTACT_QR_BASE64 }}
      BOTGO_REQUIRE_DEPLOY_CONFIG: "1"
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; skipping deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.credentials.outputs.ready == 'true'

      - name: Build site with deployment values
        if: steps.credentials.outputs.ready == 'true'
        run: npm run build

      - name: Render Worker configuration
        if: steps.credentials.outputs.ready == 'true'
        run: node scripts/render-worker-config.mjs

      - name: Apply D1 migrations
        if: steps.credentials.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply botgo --remote --config worker/wrangler.deploy.jsonc

      - name: Deploy Worker
        if: steps.credentials.outputs.ready == 'true'
        run: npx wrangler deploy --config worker/wrangler.deploy.jsonc

      - name: Deploy Pages
        if: steps.credentials.outputs.ready == 'true'
        run: npx wrangler pages deploy dist --project-name botgo --branch main

      - name: Smoke check production
        if: steps.credentials.outputs.ready == 'true'
        run: |
          node --input-type=module -e "
            const health = await fetch('${{ env.BOTGO_PUBLIC_ORIGIN }}/api/health');
            const body = await health.text();
            if (!health.ok || !body.includes('\"ok\":true')) {
              console.error('health check failed', health.status, body);
              process.exit(1);
            }
            const home = await fetch('${{ env.BOTGO_PUBLIC_ORIGIN }}/');
            if (!home.ok) {
              console.error('homepage check failed', home.status);
              process.exit(1);
            }
            console.log('production smoke check passed');
          "
