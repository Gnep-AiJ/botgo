name: BotGo Agent CLI

on:
  push:
    paths:
      - "worker/**"
      - "desktop/**"
      - "workspace*"
      - "ui-kit.*"
      - "admin*"
      - "tests/**"
      - "package.json"
      - "agent/**"
      - "install.ps1"
      - "tests/installer-smoke.ps1"
      - ".github/dependabot.yml"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "worker/**"
      - "desktop/**"
      - "workspace*"
      - "ui-kit.*"
      - "admin*"
      - "tests/**"
      - "package.json"
      - "agent/**"
      - "install.ps1"
      - "tests/installer-smoke.ps1"
      - ".github/dependabot.yml"
      - ".github/workflows/agent.yml"

permissions:
  contents: read

defaults:
  run:
    # Keep PS 5.1 module discovery consistent with the supported installer shell.
    shell: powershell

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install Agent dependencies
        working-directory: agent
        run: npm ci
      - name: Check platform and Agent source
        run: npm run check
      - name: Test platform and Agent
        run: npm test
      - name: Package Windows release
        working-directory: agent
        run: npm run package:win
      - name: Verify installer and rollback in isolated directory
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/installer-smoke.ps1
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: botgo-agent-win-x64
          path: |
            agent/dist/*.zip
            agent/dist/current.json
