<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self';img-src 'self' data:;connect-src 'self'">
  <title>BotGo Desktop</title>
  <link rel="stylesheet" href="renderer.css">
  <link rel="stylesheet" href="assets/ui-kit.css">
  <link rel="stylesheet" href="polish.css">
</head>
<body>
  <main class="desktop-shell" data-page="projects">
    <aside class="sidebar" aria-label="BotGo 导航">
      <div class="brand" aria-label="BotGo Desktop">
        <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v5"/><circle cx="16" cy="3" r="1.5"/><rect x="4" y="9" width="24" height="19" rx="7"/><circle cx="11" cy="18" r="1.5"/><circle cx="21" cy="18" r="1.5"/></svg>
        <span class="brand-copy">BotGo</span>
      </div>

      <button class="new-thread" type="button" data-new-thread>
        <span class="new-thread-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" focusable="false"><path d="M10 4v12M4 10h12"></path></svg>
        </span>
        <span>新对话</span>
      </button>

      <section class="thread-panel" aria-label="最近对话">
        <div class="section-label">最近</div>
        <div class="project-list" data-project-list>
          <p class="empty-copy">选择文件夹后开始</p>
        </div>
      </section>

      <div class="sidebar-account">
        <section class="account-menu" data-account-menu hidden role="dialog" aria-modal="true" aria-labelledby="account-menu-title">
          <div class="account-heading">
            <h2 id="account-menu-title" data-account-menu-title tabindex="-1">登录 BotGo</h2>
            <button class="icon-button" type="button" data-account-close aria-label="关闭账户菜单">
              <svg viewBox="0 0 20 20" focusable="false"><path d="m5 5 10 10M15 5 5 15"></path></svg>
            </button>
          </div>
          <div data-account-guest>
            <p>在浏览器中登录并确认这台设备。</p>
            <button class="primary wide" type="button" data-start-web-authorization>在浏览器中继续</button>
            <button class="secondary wide" type="button" data-cancel-web-authorization hidden>取消等待</button>
          </div>
          <div data-account-signed hidden>
            <div class="account-summary">
              <span class="avatar account-summary-avatar">BG</span>
              <div>
                <strong data-account-email>—</strong>
                <small>当前账户<span data-account-plan hidden></span></small>
              </div>
            </div>
            <div class="account-balance"><span>可用余额</span><strong data-account-credits>—</strong></div>
            <p class="account-expiry" hidden>到期时间 <span data-account-expiry>—</span></p>
            <section class="account-advanced" aria-label="账户操作">
              <div class="account-actions">
                <div class="account-update" data-update-row hidden>
                  <span data-update-status></span>
                  <button class="secondary" type="button" data-update-action>检查更新</button>
                </div>
                <button class="secondary" type="button" data-open-account>管理账户</button>
                <button class="danger" type="button" data-revoke-device>退出此设备</button>
              </div>
            </section>
          </div>
          <p class="form-message" data-account-message role="status" aria-live="polite"></p>
        </section>

        <button class="account-trigger" type="button" data-account-trigger aria-haspopup="dialog" aria-expanded="false">
          <span class="avatar" data-account-avatar>BG</span>
          <span class="account-trigger-copy">
            <strong data-account-name>登录 BotGo</strong>
            <small data-account-state>同步账户与额度</small>
          </span>
          <span class="account-chevron" aria-hidden="true">
            <svg viewBox="0 0 20 20" focusable="false"><path d="m7 4 6 6-6 6"></path></svg>
          </span>
        </button>
      </div>
    </aside>

    <section class="chat-workspace" aria-label="BotGo 工作区">
      <header class="chat-header">
        <button class="project-entry" type="button" data-change-project hidden aria-label="切换本地项目">
          <span class="project-entry-copy">
            <strong data-current-project>选择文件夹</strong>
            <small class="project-entry-path sr-only" data-current-project-path>打开本地项目</small>
          </span>
          <span class="project-entry-chevron" aria-hidden="true">
            <svg viewBox="0 0 20 20" focusable="false"><path d="m7 4 6 6-6 6"></path></svg>
          </span>
        </button>
        <span class="sr-only" data-thread-title>新对话</span>
        <span class="running-state" data-running-state data-state="idle" role="status" aria-live="polite">就绪</span>
        <button class="header-action" type="button" data-settings aria-haspopup="dialog">更多</button>
      </header>

      <section class="conversation" data-conversation aria-live="polite">
        <div class="conversation-empty" data-conversation-empty>
          <h1>从你的项目开始</h1>
          <p>选择文件夹，开始对话。</p>
          <button class="primary" type="button" data-empty-choose-project>选择文件夹</button>
        </div>
      </section>

      <section class="composer-wrap">
        <p class="workspace-message" data-workspace-message role="status" aria-live="polite"></p>
        <form class="composer" data-composer>
          <label class="sr-only" for="task-prompt">输入任务</label>
          <textarea id="task-prompt" data-task-prompt rows="1" placeholder="给 BotGo 一个任务…"></textarea>
          <div class="attachment-list" data-attachments aria-live="polite"></div>
          <div class="composer-toolbar">
            <div class="context-controls">
              <button type="button" class="composer-tool" data-attach>添加文件</button>
              <button type="button" class="composer-tool" data-plan aria-pressed="false">计划</button>
              <select data-model aria-label="选择模型"><option value="gpt-5.6-sol">GPT-5.6 Sol</option></select>
              <button type="button" class="model-retry" data-model-retry hidden>重新加载模型</button>
              <label class="mode-select">
                <span class="sr-only">权限与审批</span>
                <select data-mode aria-label="权限与审批">
                  <option value="auto-approve" disabled>替我审批（暂不可用）</option>
                  <option value="manual-approve" selected>手动审批</option>
                  <option value="read-only">只读</option>
                  <option value="full-access">完全访问</option>
                </select>
              </label>
            </div>
            <div class="composer-actions">
              <button class="stop-button" type="button" data-stop-task hidden aria-label="停止执行">
                <svg viewBox="0 0 20 20" focusable="false"><rect x="6" y="6" width="8" height="8" rx="1"></rect></svg>
              </button>
              <button class="send-button" type="submit" data-start-task aria-label="发送任务">
                <svg viewBox="0 0 20 20" focusable="false"><path d="M4 10h11M10 5l5 5-5 5"></path></svg>
              </button>
            </div>
          </div>
        </form>
        <p class="composer-note">Enter 发送 · Shift+Enter 换行</p>
      </section>
    </section>
  </main>
  <div class="context-menu" data-context-menu hidden role="menu" aria-label="对话操作"></div>
  <section class="project-menu" data-project-menu hidden aria-label="切换项目">
    <div class="menu-heading">项目</div>
    <div data-project-options></div>
    <button type="button" data-add-project>打开文件夹…</button>
  </section>
  <dialog class="edit-dialog" data-edit-dialog aria-labelledby="edit-title">
    <form method="dialog" data-edit-form>
      <h2 id="edit-title" data-edit-title></h2>
      <p data-edit-description></p>
      <label data-edit-label>对话名称<input data-edit-input maxlength="64" autocomplete="off"></label>
      <p data-edit-error role="alert"></p>
      <div class="dialog-actions"><button type="button" data-edit-cancel>取消</button><button class="primary" type="submit" data-edit-confirm>保存</button></div>
    </form>
  </dialog>
  <dialog class="settings-dialog" data-settings-dialog aria-labelledby="settings-title">
    <div class="settings-shell">
      <header class="settings-heading">
        <div><p class="eyebrow">原生 Codex</p><h2 id="settings-title">能力与扩展</h2></div>
        <button class="icon-button" type="button" data-settings-close aria-label="关闭能力与扩展">
          <svg viewBox="0 0 20 20" focusable="false"><path d="m5 5 10 10M15 5 5 15"></path></svg>
        </button>
      </header>
      <p class="settings-status" data-settings-status role="status" aria-live="polite"></p>
      <section class="settings-actions" aria-label="会话操作">
        <button type="button" data-review-code>审阅当前项目改动</button>
        <button type="button" data-import-configuration>导入现有 Codex 配置</button>
      </section>
      <details open>
        <summary>MCP 服务</summary>
        <div class="settings-inline-actions">
          <button type="button" data-extensions-refresh>刷新</button>
          <button type="button" data-mcp-reconnect>重新连接</button>
          <button type="button" data-mcp-cancel-login>取消 OAuth 等待</button>
        </div>
        <div class="extension-list" data-mcp-list></div>
        <details>
          <summary>添加或编辑 MCP</summary>
          <form class="mcp-form" data-mcp-form>
            <label>名称<input name="name" required pattern="[A-Za-z0-9_-]{1,64}" autocomplete="off"></label>
            <label>连接方式<select name="transport"><option value="stdio">本地 stdio</option><option value="http">HTTP</option></select></label>
            <label>命令<input name="command" autocomplete="off"></label>
            <label>参数（每行一个）<textarea name="args" rows="3"></textarea></label>
            <label>URL<input name="url" type="url" autocomplete="off"></label>
            <button type="submit">保存 MCP</button>
          </form>
        </details>
      </details>
      <details>
        <summary>Skills</summary>
        <button type="button" data-skill-install>从本地安装 Skill</button>
        <div class="extension-list" data-skills-list></div>
      </details>
      <details>
        <summary>插件</summary>
        <button type="button" data-plugin-marketplace>添加本地 Marketplace</button>
        <div class="extension-list" data-plugins-list></div>
      </details>
      <details>
        <summary>已归档会话</summary>
        <div class="extension-list" data-archived-list></div>
      </details>
      <pre class="extension-detail" data-extension-detail hidden tabindex="0"></pre>
    </div>
  </dialog>
  <section class="runtime-requests" data-runtime-requests aria-live="polite" hidden></section>
  <script src="assets/ui-kit.js"></script><script src="renderer.js"></script><script src="renderer-runtime.js"></script><script src="renderer-settings.js"></script>
</body>
</html>
