<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"><title>BotGo · 账户</title><link rel="stylesheet" href="botgo-account.css"></head>
<body data-mode="login"><main><header class="brand"><img src="botgo-mark.png" width="48" height="48" alt=""><span>BotGo</span></header><section id="details" hidden><p class="account-email" id="email"></p><div class="balance"><span>可用余额</span><strong id="balance"></strong></div></section><button id="login" class="primary"><span>登录 BotGo</span><span class="arrow" aria-hidden="true">↗</span></button><p id="status" role="status" aria-live="polite"></p><div id="account-actions" hidden><div class="action-row"><button id="recharge" class="primary">充值与账单</button><button id="refresh" class="secondary">刷新</button></div><div class="action-row utilities"><button id="check-update" class="text-button">检查更新</button><button id="logout" class="text-button">退出登录</button></div><p id="update-status" role="status"></p><button id="install-update" class="primary" hidden>重启并更新</button></div><button id="website" class="text-button website">botgo.win <span aria-hidden="true">↗</span></button></main><script src="botgo-account-ui.js"></script></body></html>
